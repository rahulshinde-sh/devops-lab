
name: DevOps Lab CI



on:

  push:

    branches:

      - main

  pull_request:

    branches:

      - main



jobs:

  validate:

    name: Validate Application

    runs-on: ubuntu-latest



    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Validate backend JavaScript

        working-directory: backend

        run: |

          docker run --rm \

            -v "$PWD":/app \

            -w /app \

            node:24-alpine \

            node --check server.js



      - name: Build backend image

        run: docker build -t devops-lab-backend:test ./backend



      - name: Build frontend image

        run: docker build -t devops-lab-frontend:test ./frontend



      - name: Validate Docker Compose

        run: docker compose config



      - name: Start backend container

        run: |

          docker run -d \

            --name ci-backend \

            -p 4000:4000 \

            devops-lab-backend:test



      - name: Wait for backend

        run: |

          for i in {1..15}; do

            if curl -fsS http://localhost:4000/api/health; then

              echo "Backend is healthy"

              exit 0

            fi

            sleep 2

          done



          echo "Backend failed to become healthy"

          docker logs ci-backend

          exit 1



      - name: Test backend server endpoint

        run: curl -fsS http://localhost:4000/api/server



      - name: Start frontend container

        run: |

          docker run -d \

            --name ci-frontend \

            -p 3000:3000 \

            devops-lab-frontend:test



      - name: Test frontend

        run: |

          for i in {1..15}; do

            if curl -fsS http://localhost:3000; then

              echo "Frontend is healthy"

              exit 0

            fi

            sleep 2

          done



          echo "Frontend failed to become healthy"

          docker logs ci-frontend

          exit 1



      - name: Cleanup

        if: always()

        run: |

          docker rm -f ci-backend ci-frontend 2>/dev/null || true

